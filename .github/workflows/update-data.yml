name: Update WowTBC data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-data.yml', 'tools/prepare-release.sh', 'tools/github-release.sh', 'CHANGELOG.md']
  schedule:
    - cron: '17 3,9,15,21 * * *'
      timezone: Europe/Warsaw
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forever-bis-data
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run tests
        id: tests
        run: node --test
      - name: Check for an unfinished release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/prepare-release.sh plan
      - name: Import and compare WowTBC data
        id: import
        if: steps.plan.outputs.pending_tag == '' && steps.plan.outputs.backfill_tag == ''
        shell: bash
        run: |
          old="$RUNNER_TEMP/forever-bis-data.before.lua"
          cp Data.lua "$old"
          node tools/import-wowtbc.mjs
          result="$(node tools/release-tools.mjs compare "$old" Data.lua)"
          changed="$(node -p 'JSON.parse(process.argv[1]).changed' "$result")"
          if [[ "$changed" == 'false' ]]; then
            mv "$old" Data.lua
            echo 'WowTBC data is unchanged.'
          else
            echo 'WowTBC data has changed.'
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Commit and push updated BiS data
        id: commit
        if: steps.import.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Data.lua
          git commit -m 'Update WoW Forever BiS data' -m 'WowTBC-Data-Update: true'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare the release archive
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_TAG: ${{ steps.plan.outputs.pending_tag }}
          BACKFILL_TAG: ${{ steps.plan.outputs.backfill_tag }}
          PUBLISHED_TAG: ${{ steps.plan.outputs.published_tag }}
          EXISTING_GITHUB_URL: ${{ steps.plan.outputs.github_url }}
        run: bash tools/prepare-release.sh package
      - name: Publish to GitHub Releases
        id: github_release
        if: ${{ !cancelled() && steps.release.outcome == 'success' && steps.release.outputs.zip != '' && steps.release.outputs.github_url == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ZIP: ${{ steps.release.outputs.zip }}
          RELEASE_CHANGELOG: ${{ steps.release.outputs.changelog }}
        shell: bash
        run: |
          url="$(bash tools/github-release.sh publish "$RELEASE_TAG" "$RELEASE_ZIP" "$RELEASE_CHANGELOG")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Upload to CurseForge
        id: upload
        if: ${{ !cancelled() && steps.release.outcome == 'success' && steps.release.outputs.zip != '' && steps.release.outputs.curseforge_file_id == '' && env.CURSEFORGE_PROJECT_ID != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CURSEFORGE_GAME_VERSION_ID: ${{ vars.CURSEFORGE_GAME_VERSION_ID }}
          RELEASE_ZIP: ${{ steps.release.outputs.zip }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANGELOG: ${{ steps.release.outputs.changelog }}
        shell: bash
        run: |
          file_id="$(node tools/release-tools.mjs upload "$RELEASE_ZIP" "$RELEASE_VERSION" "$RELEASE_CHANGELOG")"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"
          echo "CurseForge accepted file $file_id."
      - name: Record CurseForge upload
        id: receipt
        if: ${{ !cancelled() && steps.upload.outcome == 'success' && steps.upload.outputs.file_id != '' }}
        env:
          RELEASE_FILE_ID: ${{ steps.upload.outputs.file_id }}
          RELEASE_RECEIPT: ${{ steps.release.outputs.receipt }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
        shell: bash
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$RELEASE_RECEIPT" "$RELEASE_COMMIT" -m "CurseForge file $RELEASE_FILE_ID"
          git push origin "refs/tags/$RELEASE_RECEIPT"
      - name: Write run summary
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          IMPORT: ${{ steps.import.outcome }}
          CHANGED: ${{ steps.import.outputs.changed }}
          PENDING_TAG: ${{ steps.plan.outputs.pending_tag }}
          BACKFILL_TAG: ${{ steps.plan.outputs.backfill_tag }}
          COMMIT: ${{ steps.commit.outcome }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          PACKAGE: ${{ steps.release.outcome }}
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
          GITHUB_RELEASE: ${{ steps.github_release.outcome }}
          GITHUB_RELEASE_URL: ${{ steps.github_release.outputs.url || steps.release.outputs.github_url }}
          UPLOAD: ${{ steps.upload.outcome }}
          FILE_ID: ${{ steps.upload.outputs.file_id }}
          PREVIOUS_FILE_ID: ${{ steps.release.outputs.curseforge_file_id }}
          VERSION: ${{ steps.release.outputs.version }}
          RECEIPT: ${{ steps.receipt.outcome }}
        shell: bash
        run: |
          step_result() {
            case "$1" in
              success) printf 'Passed' ;;
              failure) printf 'Failed' ;;
              cancelled) printf 'Cancelled' ;;
              *) printf 'Skipped' ;;
            esac
          }

          import_result="$(step_result "$IMPORT")"
          case "$CHANGED" in
            true) import_result='Data changed' ;;
            false) import_result='No changes' ;;
          esac
          if [[ "$IMPORT" == 'skipped' && ( -n "$PENDING_TAG" || -n "$BACKFILL_TAG" ) ]]; then
            import_result='Skipped — finishing a pending release'
          fi

          commit_result="$(step_result "$COMMIT")"
          if [[ -n "$COMMIT_SHA" ]]; then
            commit_result="Pushed [${COMMIT_SHA:0:7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA)"
          fi

          package_result="$(step_result "$PACKAGE")"
          case "$RELEASE_STATUS" in
            ready) package_result="Prepared version $VERSION" ;;
            not_queued) package_result='Skipped — no release queued' ;;
            already_published) package_result='Skipped — already published' ;;
          esac

          github_result="$(step_result "$GITHUB_RELEASE")"
          if [[ -n "$GITHUB_RELEASE_URL" ]]; then
            github_result="[Available on GitHub]($GITHUB_RELEASE_URL)"
          fi

          upload_result="$(step_result "$UPLOAD")"
          if [[ -n "$FILE_ID" ]]; then
            upload_result="Accepted [file $FILE_ID](https://www.curseforge.com/wow/addons/forever-bis-tooltip/files/$FILE_ID)"
          elif [[ -n "$PREVIOUS_FILE_ID" ]]; then
            upload_result="Already accepted [file $PREVIOUS_FILE_ID](https://www.curseforge.com/wow/addons/forever-bis-tooltip/files/$PREVIOUS_FILE_ID)"
          elif [[ "$UPLOAD" == 'failure' ]]; then
            upload_result='Failed to confirm upload'
          elif [[ -z "$CURSEFORGE_PROJECT_ID" ]]; then
            upload_result='Skipped — project ID is missing'
          fi

          {
            echo '### Forever BiS Tooltip update'
            echo
            printf 'Trigger: **%s**\n\n' "$GITHUB_EVENT_NAME"
            echo '| Step | Result |'
            echo '| --- | --- |'
            printf '| Tests | %s |\n' "$(step_result "$TESTS")"
            printf '| Check for unfinished release | %s |\n' "$(step_result "$PLAN")"
            printf '| Import and compare | %s |\n' "$import_result"
            printf '| Commit and push Data.lua | %s |\n' "$commit_result"
            printf '| Prepare release archive | %s |\n' "$package_result"
            printf '| Publish to GitHub Releases | %s |\n' "$github_result"
            printf '| Upload to CurseForge | %s |\n' "$upload_result"
            printf '| Record CurseForge upload | %s |\n' "$(step_result "$RECEIPT")"
            echo
            echo 'For error details, expand the failed step in the update-data job logs.'
            if [[ -n "$FILE_ID" && "$RECEIPT" != 'success' ]]; then
              echo 'CurseForge accepted the file. Check the upload receipt before rerunning to avoid a duplicate.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
